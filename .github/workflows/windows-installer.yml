name: Windows installer

on:
  push:
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libdbus-1-dev \
            libxcb1-dev \
            libx11-dev \
            libxdo-dev \
            libssl-dev \
            pkg-config \
            build-essential
      - name: Test the dictation core
        working-directory: src-tauri
        run: cargo test -- --test-threads=1 --nocapture

  test-windows:
    name: Windows tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install frontend dependencies
        run: npm ci
      - name: Microphone, credentials, paste, Groq, and startup smoke
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/selftest.ps1
        env:
          # Optional. When this repository secret is absent the live Groq
          # cases print SKIP and the rest of the suite still runs.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

  installer:
    name: Build MSI and NSIS
    needs: [test, test-windows]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install frontend dependencies
        run: npm ci
      - name: Build the Windows installer
        run: npm run tauri build
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: bolo-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
