name: Release

# Real release: push a tag like v0.1.6 that matches src-tauri/tauri.conf.json.
# Dry run: Actions > Release > Run workflow (dry_run = true). Builds, tests, signs,
# makes latest.json and the .msixupload as run artifacts only. It never pushes the
# website and never creates a GitHub Release, so users get nothing new.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and sign only, no website push, no GitHub Release"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  STORE_APP_ID: 9NMW6C99BF04
  STORE_IDENTITY_NAME: TaimoorHussain.Bolo.com
  STORE_PUBLISHER: CN=3E755E45-53C2-4826-A318-2D528490BD69
  STORE_PUBLISHER_DISPLAY_NAME: Taimoor Hussain
  BASE_URL: https://bolo.thebetawebsite.com
  # A manual run is a dry run unless dry_run is explicitly unticked AND it runs on a tag.
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run || !startsWith(github.ref, 'refs/tags/v')) }}

jobs:
  build:
    name: Test, build and sign the NSIS installer
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      dry_run: ${{ steps.ver.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v5
      - name: Read version (tag must match on a real release)
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($env:DRY_RUN -ne 'true' -and "v$v" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match tauri.conf.json version $v" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "dry_run=$env:DRY_RUN" >> $env:GITHUB_OUTPUT
          "Version $v, dry run: $env:DRY_RUN"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - name: cargo test (no --ignored)
        working-directory: src-tauri
        run: cargo test -- --test-threads=1
      - name: Build the NSIS installer
        shell: pwsh
        run: |
          # Updater artifacts are signed in the next step, so the build never prompts for a password.
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content updater-off.conf.json -Encoding utf8NoBOM
          npx tauri build --bundles nsis --config updater-off.conf.json
          if ($LASTEXITCODE -ne 0) { throw "tauri build failed" }
      - name: Write the updater key to a temp file
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw "TAURI_SIGNING_PRIVATE_KEY secret is missing" }
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\updater.key", $env:TAURI_SIGNING_PRIVATE_KEY.Trim())
      - name: Sign the installer (empty password via cmd, stdin closed so it cannot hang)
        shell: cmd
        timeout-minutes: 5
        run: |
          for %%f in (src-tauri\target\release\bundle\nsis\*_x64-setup.exe) do (
            call npx tauri signer sign -f "%RUNNER_TEMP%\updater.key" -p "" "%%f" < NUL || exit /b 1
          )
      - name: Remove the temp key
        if: always()
        shell: pwsh
        run: Remove-Item "$env:RUNNER_TEMP\updater.key" -ErrorAction SilentlyContinue
      - name: Read annotated tag notes
        shell: bash
        run: |
          # actions/checkout is shallow, so a local tag is lightweight and
          # %(contents) is the commit message. updater-notes.sh fetches the
          # annotated tag and refuses the commit message.
          tag="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then tag="v${{ steps.ver.outputs.version }}"; fi
          bash scripts/updater-notes.sh . "$tag" > "$RUNNER_TEMP/updater-notes.txt"
      - name: Write latest.json
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $name = "Bolo_${v}_x64-setup.exe"
          $nsis = "src-tauri/target/release/bundle/nsis"
          $exe = Get-ChildItem $nsis -Filter "*_${v}_x64-setup.exe" | Select-Object -First 1
          if (-not $exe) { throw "No installer for $v in $nsis" }
          if (-not (Test-Path "$($exe.FullName).sig")) { throw "Signature missing" }
          $sig = Get-Content "$($exe.FullName).sig" -Raw
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item $exe.FullName "out/$name"
          Copy-Item "$($exe.FullName).sig" "out/$name.sig"
          $notes = Get-Content "$env:RUNNER_TEMP/updater-notes.txt" -Raw
          if (-not "$notes".Trim()) { throw "Updater notes were empty" }
          [ordered]@{
            version  = $v
            notes    = "$notes".Trim()
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{ "windows-x86_64" = @{ signature = $sig.Trim(); url = "$env:BASE_URL/downloads/$name" } }
          } | ConvertTo-Json -Depth 5 | Set-Content out/latest.json -Encoding utf8NoBOM
          Get-ChildItem out | Format-Table Name, Length
      - name: Verify the signature against the app's public key
        shell: pwsh
        run: |
          # The .sig is base64 of a minisign signature; check it names the same key id as tauri.conf.json's pubkey.
          $pub = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String((Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).plugins.updater.pubkey))
          $sig = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String((Get-Content (Get-ChildItem out -Filter *.sig).FullName -Raw).Trim()))
          $pubId = [Convert]::FromBase64String(($pub -split "`n")[1].Trim())[2..9]
          $sigId = [Convert]::FromBase64String(($sig -split "`n")[1].Trim())[2..9]
          if (Compare-Object $pubId $sigId) { throw "Installer was signed with a different key than tauri.conf.json trusts" }
          "Signature key id matches the updater pubkey"
      - uses: actions/upload-artifact@v4
        with:
          name: nsis
          path: out/
          if-no-files-found: error

  store:
    name: Build the .msixupload
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target-store
      - run: npm ci
      - name: Build MSIX (no in-app updater) and wrap it as .msixupload
        shell: pwsh
        run: |
          $v = "${{ needs.build.outputs.version }}.0"
          ./scripts/build-msix.ps1 -IdentityName $env:STORE_IDENTITY_NAME -Publisher $env:STORE_PUBLISHER `
            -PublisherDisplayName $env:STORE_PUBLISHER_DISPLAY_NAME -Version $v
          $msix = "target-msix/Bolo_${v}_x64.msix"
          if (-not (Test-Path $msix)) { throw "Missing $msix" }
          Compress-Archive -Path $msix -DestinationPath "target-msix/Bolo_${v}_x64.zip" -Force
          Move-Item "target-msix/Bolo_${v}_x64.zip" "target-msix/Bolo_${v}_x64.msixupload" -Force
          Get-ChildItem target-msix | Format-Table Name, Length
      # Optional: automatic Store submission. Needs Partner Center API access (MSSTORE_* secrets).
      # Uncomment when those secrets exist; until then upload the .msixupload in Partner Center by hand.
      # - uses: microsoft/setup-msstore-cli@v1
      # - name: Submit to Partner Center
      #   if: env.DRY_RUN != 'true'
      #   shell: pwsh
      #   env:
      #     MSSTORE_TENANT_ID: ${{ secrets.MSSTORE_TENANT_ID }}
      #     MSSTORE_SELLER_ID: ${{ secrets.MSSTORE_SELLER_ID }}
      #     MSSTORE_CLIENT_ID: ${{ secrets.MSSTORE_CLIENT_ID }}
      #     MSSTORE_CLIENT_SECRET: ${{ secrets.MSSTORE_CLIENT_SECRET }}
      #   run: |
      #     msstore reconfigure --tenantId $env:MSSTORE_TENANT_ID --sellerId $env:MSSTORE_SELLER_ID `
      #       --clientId $env:MSSTORE_CLIENT_ID --clientSecret $env:MSSTORE_CLIENT_SECRET
      #     if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure failed" }
      #     msstore publish "target-msix/Bolo_${{ needs.build.outputs.version }}.0_x64.msix" --appId $env:STORE_APP_ID
      #     if ($LASTEXITCODE -ne 0) { throw "msstore publish failed (a pending submission blocks this)" }
      - uses: actions/upload-artifact@v4
        with:
          name: msix
          path: target-msix/*.msixupload
          if-no-files-found: error

  website:
    # Same as 0.1.4/0.1.5: the site is a git checkout on the server. Pushing to
    # bolo-website triggers its own Deploy workflow, which pulls on the server.
    name: Publish installer + latest.json to bolo.thebetawebsite.com
    needs: [build, store]
    if: needs.build.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: nsis, path: out }
      - uses: actions/checkout@v5
        with:
          repository: taimoorKVD/bolo-website
          ssh-key: ${{ secrets.WEBSITE_REPO_DEPLOY_KEY }}
          path: website
      - name: Copy files, update version.json and download links
        shell: pwsh
        working-directory: website
        run: |
          $v = "${{ needs.build.outputs.version }}"
          $name = "Bolo_${v}_x64-setup.exe"
          Copy-Item "../out/$name" "downloads/$name" -Force
          New-Item -ItemType Directory -Force updates | Out-Null
          Copy-Item ../out/latest.json updates/latest.json -Force
          $j = Get-Content version.json -Raw | ConvertFrom-Json
          $j.version = $v
          $j.downloads.nsis.href = "downloads/$name"
          $j.downloads.nsis.bytes = (Get-Item "downloads/$name").Length
          $j | ConvertTo-Json -Depth 5 | Set-Content version.json -Encoding utf8NoBOM
          $h = Get-Content index.html -Raw
          $h = $h -replace 'downloads/Bolo_[0-9][0-9.]*_x64-setup\.exe', "downloads/$name"
          Set-Content index.html $h -NoNewline -Encoding utf8NoBOM
      - name: Rewrite marketing pages and README from version.json
        working-directory: website
        run: |
          # The site's Deploy workflow runs `python3 scripts/sync-release.py --check`
          # and refuses to publish if the homepage, other pages, or README still
          # show the previous version. 0.1.10 pushed the installer and then failed
          # that check. version.json is the source; this script rewrites the rest.
          test -f scripts/sync-release.py
          python3 scripts/sync-release.py
      - name: Commit and push (triggers site deploy)
        working-directory: website
        run: |
          git config user.name "bolo-release-bot"
          git config user.email "bolo-release-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Website already has this version"; exit 0; }
          git commit -m "Bolo ${{ needs.build.outputs.version }}"
          git push
      - name: Smoke test after deploy
        run: |
          for i in $(seq 1 30); do
            v=$(curl -fsS https://bolo.thebetawebsite.com/updates/latest.json | python3 -c "import json,sys; print(json.load(sys.stdin)['version'])" || true)
            [ "$v" = "${{ needs.build.outputs.version }}" ] && echo "latest.json is live: $v" && exit 0
            sleep 20
          done
          echo "::error::bolo-website received the files, but its Deploy workflow did not publish /updates/latest.json within 10 minutes. That deploy lives in taimoorKVD/bolo-website. Do not re-push from this job."
          exit 1

  github-release:
    name: GitHub Release
    # Website smoke is a separate deploy in bolo-website. A slow or failed
    # site publish must not skip the GitHub Release, which is what left 0.1.10's
    # workflow red after the installer was already built.
    needs: [build, store]
    if: needs.build.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - name: Use the updater notes as the GitHub release body
        run: python3 -c "import json; open('out/release-notes.txt','w').write(json.load(open('out/latest.json'))['notes'].strip()+'\n')"
      - uses: softprops/action-gh-release@v2
        with:
          name: Bolo ${{ needs.build.outputs.version }}
          body_path: out/release-notes.txt
          files: |
            out/*.exe
            out/*.sig
            out/latest.json
            out/*.msixupload