[package]
name = "cadence"
version = "0.1.0"
description = "Bolo.com push-to-talk voice dictation for Windows"
authors = ["Bolo.com"]
edition = "2021"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cadence_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
cpal = "0.15"
hound = "3.5"
arboard = "3"
open = "5"
zeroize = { version = "1", features = ["derive"] }
flacenc = "0.5.1"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "native-tls", "http2"] }
# The `#[implement]` macro emits `::windows_core::` paths. Pin the same
# version the `windows` 0.61 crate uses so those paths are not ambiguous.
windows-core = "=0.61.2"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security_Credentials",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(not(windows))'.dependencies]
keyring = "3"
device_query = "2.1"
enigo = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "http2"] }

# `tauri dev` is a debug build. Optimize this crate so capture and encoding
# are not the thing that makes a take feel slow while developing.
[profile.dev.package.cadence]
opt-level = 3

# Latency checks run under `cargo test`, which uses the test profile.
[profile.test.package.cadence]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
