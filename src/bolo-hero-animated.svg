<svg xmlns="http://www.w3.org/2000/svg" width="720" height="280" viewBox="0 0 720 280" role="img" aria-label="Bolo — speak anywhere in Windows">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#100F0C"/>
      <stop offset="100%" stop-color="#1A1814"/>
    </linearGradient>
  </defs>
  <rect width="720" height="280" rx="24" fill="url(#bg)"/>
  <!-- pulsing sound rings (decorative, not a product screenshot) -->
  <g transform="translate(140 140)" fill="none" stroke="#C9A227" stroke-width="2" opacity="0.55">
    <circle r="58">
      <animate attributeName="r" values="52;78;52" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0.05;0.55" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="72">
      <animate attributeName="r" values="66;96;66" dur="2.4s" begin="0.35s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.02;0.4" dur="2.4s" begin="0.35s" repeatCount="indefinite"/>
    </circle>
    <circle r="88">
      <animate attributeName="r" values="80;112;80" dur="2.4s" begin="0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.28;0;0.28" dur="2.4s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
  </g>
  <image href="data:image/png;base64," x="76" y="76" width="128" height="128">
    <animateTransform attributeName="transform" type="scale" values="1;1.04;1" dur="2.4s" repeatCount="indefinite" additive="sum" transform-origin="140 140"/>
  </image>
  <text x="250" y="118" fill="#F4EFE6" font-family="Georgia, 'Palatino Linotype', Palatino, serif" font-size="48" font-weight="700">Bolo</text>
  <text x="250" y="158" fill="#C9A227" font-family="Segoe UI, system-ui, sans-serif" font-size="22">speak anywhere in Windows</text>
  <text x="250" y="198" fill="#A39E93" font-family="Segoe UI, system-ui, sans-serif" font-size="16">Hold Ctrl+Win · Speak · Let go</text>
</svg>